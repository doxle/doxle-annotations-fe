[package]
name = "app-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "app-web"
path = "src/main.rs"

[dependencies]
# Dioxus 0.7.0-rc
dioxus = { version = "0.7.0-rc.2", features = ["web", "router"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (for API calls) - use js backend for WASM
reqwest = { version = "0.12", features = ["json"], default-features = false }
gloo-net = "0.6"
web-time = "1.0"

# Logging
tracing = "0.1"
tracing-wasm = "0.2"
web-sys = { version = "0.3", features = [
    "Window", "MediaQueryList", "Document", "Element",
    "HtmlHeadElement", "Storage", "HtmlCanvasElement", "CanvasRenderingContext2d", "CanvasPattern",
    "CssStyleDeclaration", "HtmlElement", "HtmlImageElement", "MouseEvent", "DragEvent",
    "WebSocket", "MessageEvent", "CloseEvent", "ErrorEvent", "BinaryType",
    "File", "FileList", "FileReader", "Blob", "BlobPropertyBag", "FilePropertyBag", "Url", "HtmlInputElement", "DataTransfer",
    "RequestCredentials", "HtmlDocument", "HtmlVideoElement"
] }
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
gloo-timers = { version = "0.3", features = ["futures"] }
base64 = "0.22.1"
futures = "0.3.31"
uuid = { version = "1.19.0", features = ["v4", "js"] }
urlencoding = "2.1"
