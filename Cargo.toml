[package]
name = "app-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "app-web"
path = "src/main.rs"

[dependencies]
# Dioxus 0.7.0-rc
dioxus = { version = "0.7.0-rc", features = ["web", "router"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client (for API calls)
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-wasm = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlHeadElement", "Storage"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

