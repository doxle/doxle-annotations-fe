[package]
name = "app-web"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "app-web"
path = "src/main.rs"

[dependencies]
# Internal crates
canvas-web = { path = "../canvas-web" }

# Shared crates from doxle-core
doxle-core = { workspace = true }
doxle-ui-components = { workspace = true }

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }

# Dioxus
dioxus = { workspace = true }
dioxus-web = { workspace = true }

# HTTP client (for API calls)
reqwest = { version = "0.12", features = ["json"] }

# Logging
tracing = "0.1"
tracing-wasm = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlHeadElement"] }
wasm-bindgen = "0.2"
