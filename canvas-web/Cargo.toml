[package]
name = "canvas-web"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[dependencies]
# Shared crates from doxle-core
doxle-core = { workspace = true }

# Workspace dependencies
serde = { workspace = true }
serde_json = { workspace = true }

# Web specific
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "Window",
    "Document",
    "MouseEvent",
    "TouchEvent",
] }
js-sys = "0.3"
