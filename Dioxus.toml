[application]
name = "Doxle Web"
default_platform = "web"
out_dir = "dist"
asset_dir = "assets"

[web.app]
title = "Doxle"

[web.watcher]
reload_html = true
watch_path = ["src", "public"]

# Proxy API requests to local backend - fixes SameSite cookie issues
[[web.proxy]]
backend = "http://localhost:9000"
