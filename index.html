<!DOCTYPE html>
<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Doxle">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,300,500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("/sw.js");
      }
    </script>
    <!-- Prevent flash: set theme class + background BEFORE wasm loads -->
    <script>
      (function(){
        var h=document.documentElement;
        var s=localStorage.getItem('doxle_theme');
        if(s==='dark')h.className='dark';
        else if(s==='light')h.className='light';
        else if(window.matchMedia('(prefers-color-scheme:dark)').matches)h.className='dark';
        else h.className='light';
      })();
    </script>
    <style>
      html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; }
      body { background:#ffffff; }
      html.dark body { background:#000000; }
    </style>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
