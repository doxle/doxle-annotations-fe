<!DOCTYPE html>
<html>
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta charset="UTF-8">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Doxle">
    <meta name="theme-color" content="#ffffff">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,300,500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
    <script>
      (function () {
        if (!("serviceWorker" in navigator)) return;

        var hostname = window.location.hostname;
        var isProdHost =
          hostname === "doxle.ai" ||
          hostname === "www.doxle.ai" ||
          hostname === "doxle.com" ||
          hostname === "www.doxle.com";

        if (!isProdHost) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) {
              registration.unregister();
            });
          });

          if ("caches" in window) {
            caches.keys().then(function (keys) {
              keys.forEach(function (key) {
                caches.delete(key);
              });
            });
          }
          return;
        }

        navigator.serviceWorker.register("/sw.js");
      })();
    </script>
    <!-- Prevent flash: set theme class + background BEFORE wasm loads -->
    <script>
      (function(){
        var h=document.documentElement;
        var s=localStorage.getItem('doxle_theme');
        if(s==='dark')h.className='dark';
        else if(s==='light')h.className='light';
        else if(window.matchMedia('(prefers-color-scheme:dark)').matches)h.className='dark';
        else h.className='light';
        var t=document.querySelector('meta[name="theme-color"]');
        if(t)t.setAttribute('content',h.className==='dark'?'#060606':'#ffffff');
        var m=document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if(m)m.setAttribute('content',h.className==='dark'?'black-translucent':'default');
      })();
    </script>
    <style>
      html, body { margin:0; padding:0; height:100%; width:100%; overflow:hidden; }
      body { background:#ffffff; }
      html.dark body { background:#000000; }
    </style>
  </head>
  <body>
    <div id="main"></div>
  </body>
</html>
